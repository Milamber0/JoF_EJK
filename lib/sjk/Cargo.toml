[workspace]
members = [
    "crates/sjk-bsp",
    "crates/sjk-dedicated",
    "crates/sjk-audio",
    "crates/sjk-client",
    "crates/sjk-entity",
    "crates/sjk-game-jka",
    "crates/sjk-icarus",
    "crates/sjk-identity",
    "crates/sjk-mod",
    "crates/sjk-mod-japlus",
    "crates/sjk-mod-jof",
    "crates/sjk-materialgen",
    "crates/sjk-effect",
    "crates/sjk-model",
    "crates/sjk-nav",
    "crates/sjk-network",
    "crates/sjk-protocol",
    "crates/sjk-runtime",
    "crates/sjk-scene",
    "crates/sjk-server",
    "crates/sjk-shader",
    "crates/sjk-shell",
    "crates/sjk-ui",
    "crates/sjk-vfs",
    "crates/sjk-viewer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
sjk-bsp = { path = "crates/sjk-bsp" }
sjk-audio = { path = "crates/sjk-audio" }
sjk-client = { path = "crates/sjk-client" }
sjk-entity = { path = "crates/sjk-entity" }
sjk-game-jka = { path = "crates/sjk-game-jka" }
sjk-icarus = { path = "crates/sjk-icarus" }
sjk-identity = { path = "crates/sjk-identity" }
sjk-mod = { path = "crates/sjk-mod" }
sjk-mod-japlus = { path = "crates/sjk-mod-japlus" }
sjk-mod-jof = { path = "crates/sjk-mod-jof" }
sjk-effect = { path = "crates/sjk-effect" }
sjk-model = { path = "crates/sjk-model" }
sjk-nav = { path = "crates/sjk-nav" }
sjk-network = { path = "crates/sjk-network" }
sjk-protocol = { path = "crates/sjk-protocol" }
sjk-runtime = { path = "crates/sjk-runtime" }
sjk-scene = { path = "crates/sjk-scene" }
sjk-server = { path = "crates/sjk-server" }
sjk-shader = { path = "crates/sjk-shader" }
sjk-shell = { path = "crates/sjk-shell" }
sjk-ui = { path = "crates/sjk-ui" }
sjk-vfs = { path = "crates/sjk-vfs" }
glam = "0.33.0"
md4 = "0.10.2"
md-5 = "0.10.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
